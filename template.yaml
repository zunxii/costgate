AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: CostGate PR cloud-cost analysis pipeline

Parameters:
  WebhookSecret:
    Type: String
    NoEcho: true
    Description: GitHub webhook secret

  GitHubAppId:
    Type: String
    Default: "4992403"

  GitHubInstallationId:
    Type: String
    Default: "162807620"
    Description: Optional legacy/default installation used by older worker flows; webhook events use their installation id.

  GitHubAppSlug:
    Type: String
    Default: "costgate-bot"

  AuthJwtSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: HMAC secret shared by the CostGate API and the Next.js BFF for authenticated sessions

  RdsHost:
    Type: String
    Default: "costgate-db.cfo2wamsmj7q.eu-north-1.rds.amazonaws.com"

  RdsRegion:
    Type: String
    Default: "eu-north-1"

  RdsEngine:
    Type: String
    Default: "postgres"

  RdsInstanceClass:
    Type: String
    Default: "db.t4g.small"

  RdsInstanceHourlyUsd:
    Type: String
    Default: "0.04"
    Description: Cost-model input assumption, not an AWS billing guarantee

  MonthlyRequests:
    Type: String
    Default: "1000000"

  # Optional real CUR 2.0 / Athena configuration. These are not
  # optional for deployments that use AWS CUR reconciliation.
  CurDatabase:
    Type: String
    Default: ""
    Description: Athena/Glue database containing the CUR 2.0 table

  CurTable:
    Type: String
    Default: ""
    Description: Athena CUR 2.0 table, optionally qualified as database.table

  CurWorkGroup:
    Type: String
    Default: "primary"

  CurQueryResultsS3Uri:
    Type: String
    Default: "s3://costgate-cur-114729957390/costgate/athena-query-results"
    Description: S3 location where Athena query results are written

  CurRegion:
    Type: String
    Default: "us-east-1"
    Description: AWS region containing the CUR Data Export and Athena resources

  CurQueryResultsBucketArn:
    Type: String
    Default: "arn:aws:s3:::costgate-cur-114729957390"
    Description: S3 bucket ARN used for Athena query results

  AnalysisSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Default: "subnet-099621f07d6a1a31a,subnet-00f174b5c564fe3df"

  AnalysisSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Default: "sg-0fe5469c57a6dce2a"

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - x86_64
    MemorySize: 256

Resources:

  # ------------------------------------------------------------------
  # Queueing
  # ------------------------------------------------------------------

  WebhookDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  WebhookQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 360
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt WebhookDeadLetterQueue.Arn
        maxReceiveCount: 3
  # ------------------------------------------------------------------
  # Public GitHub webhook
  # ------------------------------------------------------------------

  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: app/handlers/
      Handler: webhook.lambda_handler
      Timeout: 10

      Environment:
        Variables:
          GITHUB_WEBHOOK_SECRET: !Ref WebhookSecret
          WEBHOOK_QUEUE_URL: !Ref WebhookQueue

      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt WebhookQueue.Arn

      Events:
        GitHubWebhook:
          Type: HttpApi
          Properties:
            Path: /github/webhook
            Method: POST

  PredictionLedgerTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: prediction_id
          AttributeType: S
        - AttributeName: repository
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
        - AttributeName: author
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: verification_due_at
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S

      KeySchema:
        - AttributeName: prediction_id
          KeyType: HASH

      GlobalSecondaryIndexes:
        - IndexName: RepositoryCreatedAtIndex
          KeySchema:
            - AttributeName: repository
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

        - IndexName: AuthorCreatedAtIndex
          KeySchema:
            - AttributeName: author
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

        - IndexName: VerificationDueIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: verification_due_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

        - IndexName: UserCreatedAtIndex
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ------------------------------------------------------------------
  # GitHub PR processor
  # ------------------------------------------------------------------

  ProcessorFunction:
    Type: AWS::Serverless::Function

    Metadata:
      BuildMethod: makefile

    Properties:
      CodeUri: .
      Handler: app.handlers.processor.lambda_handler
      Timeout: 45

      Environment:
        Variables:
          ANALYSIS_FUNCTION_NAME: !Ref AnalysisFunction

          GITHUB_APP_ID: !Ref GitHubAppId
          GITHUB_INSTALLATION_ID: !Ref GitHubInstallationId

          GITHUB_PRIVATE_KEY: '{{resolve:secretsmanager:costgate/github/private-key:SecretString}}'
          PREDICTION_TABLE_NAME: !Ref PredictionLedgerTable
          CONNECTION_TABLE_NAME: !Ref ConnectionTable
          POLICY_TABLE_NAME: !Ref PolicyTable
          PR_STUDIO_JOB_TABLE_NAME: !Ref PRStudioJobTable
          BEDROCK_MODEL_ID: "eu.anthropic.claude-haiku-4-5-20251001-v1:0"
          COSTGATE_ENABLE_EXPLANATION: "false"
          COSTGATE_ENABLE_CHECK: "true"
          COSTGATE_WARN_USD: "5"
          COSTGATE_BLOCK_USD: "25"
          COSTGATE_MIN_CONFIDENCE: "medium"
          CUR_DATABASE: !Ref CurDatabase
          CUR_TABLE: !Ref CurTable
          CUR_WORKGROUP: !Ref CurWorkGroup
          CUR_QUERY_RESULTS_S3_URI: !Ref CurQueryResultsS3Uri
          CUR_REGION: !Ref CurRegion

      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
                - sqs:ChangeMessageVisibility
              Resource: !GetAtt WebhookQueue.Arn

            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !GetAtt AnalysisFunction.Arn

            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:Query
              Resource:
                - !GetAtt PredictionLedgerTable.Arn
                - !Sub "${PredictionLedgerTable.Arn}/index/*"
                - !GetAtt ConnectionTable.Arn
                - !Sub "${ConnectionTable.Arn}/index/*"
                - !GetAtt PolicyTable.Arn
                - !GetAtt PRStudioJobTable.Arn

            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:GetInferenceProfile
              Resource:
                - !Sub >-
                    arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/
                    eu.anthropic.claude-haiku-4-5-20251001-v1:0

                - arn:aws:bedrock:eu-central-1::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
                - arn:aws:bedrock:eu-north-1::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
                - arn:aws:bedrock:eu-south-1::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
                - arn:aws:bedrock:eu-south-2::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
                - arn:aws:bedrock:eu-west-1::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
                - arn:aws:bedrock:eu-west-3::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0

      Events:
        WebhookQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt WebhookQueue.Arn
            BatchSize: 1

  ReconciliationFunction:
    Type: AWS::Serverless::Function

    Metadata:
      BuildMethod: makefile

    Properties:
      CodeUri: .
      Handler: app.handlers.reconcile.lambda_handler
      Timeout: 120

      Environment:
        Variables:
          PREDICTION_TABLE_NAME: !Ref PredictionLedgerTable
          CUR_DATABASE: !Ref CurDatabase
          CUR_TABLE: !Ref CurTable
          CUR_WORKGROUP: !Ref CurWorkGroup
          CUR_QUERY_RESULTS_S3_URI: !Ref CurQueryResultsS3Uri
          CUR_REGION: !Ref CurRegion
          LEDGER_REGION: !Ref RdsRegion
          COSTGATE_RECONCILIATION_BATCH: "10"

      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt PredictionLedgerTable.Arn
                - !Sub "${PredictionLedgerTable.Arn}/index/*"

            - Effect: Allow
              Action:
                - athena:StartQueryExecution
                - athena:GetQueryExecution
                - athena:GetQueryResults
                - athena:GetWorkGroup
              Resource: "*"

            - Effect: Allow
              Action:
                - s3:GetBucketLocation
                - s3:ListBucket
              Resource: !Ref CurQueryResultsBucketArn

            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:AbortMultipartUpload
              Resource: !Sub "${CurQueryResultsBucketArn}/costgate/athena-query-results/*"

      Events:
        ReconciliationSchedule:
          Type: Schedule
          Properties:
            Schedule: "rate(1 hour)"
            Enabled: true
  # ------------------------------------------------------------------
  # Authenticated application API
  # ------------------------------------------------------------------

  UserTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: email
          AttributeType: S
        - AttributeName: github_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: EmailIndex
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: GithubIdIndex
          KeySchema:
            - AttributeName: github_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  ConnectionTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connection_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: repository
          AttributeType: S
        - AttributeName: installation_id
          AttributeType: S
      KeySchema:
        - AttributeName: connection_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserRepoIndex
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: repository
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: InstallationRepoIndex
          KeySchema:
            - AttributeName: installation_id
              KeyType: HASH
            - AttributeName: repository
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  PolicyTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH

  PRStudioJobTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  DashboardFunction:
    Type: AWS::Serverless::Function

    Metadata:
      BuildMethod: makefile

    Properties:
      CodeUri: .
      Handler: app.handlers.api.lambda_handler
      Timeout: 30

      Environment:
        Variables:
          PREDICTION_TABLE_NAME: !Ref PredictionLedgerTable
          USER_TABLE_NAME: !Ref UserTable
          CONNECTION_TABLE_NAME: !Ref ConnectionTable
          POLICY_TABLE_NAME: !Ref PolicyTable
          AUTH_JWT_SECRET: !Ref AuthJwtSecret
          GITHUB_APP_ID: !Ref GitHubAppId
          GITHUB_INSTALLATION_ID: !Ref GitHubInstallationId
          GITHUB_APP_SLUG: !Ref GitHubAppSlug
          GITHUB_PRIVATE_KEY: '{{resolve:secretsmanager:costgate/github/private-key:SecretString}}'
          ANALYSIS_FUNCTION_NAME: !Ref AnalysisFunction
          PROCESSOR_FUNCTION_NAME: !Ref ProcessorFunction
          PR_STUDIO_JOB_TABLE_NAME: !Ref PRStudioJobTable

      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:BatchWriteItem
              Resource:
                - !GetAtt UserTable.Arn
                - !Sub "${UserTable.Arn}/index/*"
                - !GetAtt ConnectionTable.Arn
                - !Sub "${ConnectionTable.Arn}/index/*"
                - !GetAtt PolicyTable.Arn
                - !GetAtt PredictionLedgerTable.Arn
                - !Sub "${PredictionLedgerTable.Arn}/index/*"
                - !GetAtt PRStudioJobTable.Arn

            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !GetAtt AnalysisFunction.Arn
                - !GetAtt ProcessorFunction.Arn

      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /api/{proxy+}
            Method: ANY

      
  # ------------------------------------------------------------------
  # Database analysis worker
  # ------------------------------------------------------------------

  AnalysisFunction:
    Type: AWS::Serverless::Function

    Metadata:
      BuildMethod: makefile

    Properties:
      CodeUri: .
      Handler: app.handlers.analyze.lambda_handler
      Timeout: 30

      VpcConfig:
        SubnetIds: !Ref AnalysisSubnetIds
        SecurityGroupIds:
          - !Ref AnalysisSecurityGroupId

      Environment:
        Variables:
          RDSHOST: !Ref RdsHost
          PGPORT: "5432"
          PGDATABASE: "costgate"
          PGUSER: "postgres"
          PGPASSWORD: '{{resolve:secretsmanager:costgate/rds/password:SecretString}}'

          PGSSLMODE: "verify-full"
          PGSSLROOTCERT: "/var/task/global-bundle.pem"

          RDS_REGION: !Ref RdsRegion
          RDS_ENGINE: !Ref RdsEngine
          RDS_INSTANCE_CLASS: !Ref RdsInstanceClass
          RDS_INSTANCE_HOURLY_USD: !Ref RdsInstanceHourlyUsd
          RDS_RESOURCE_ID: "costgate-db"

          COSTGATE_MONTHLY_REQUESTS: !Ref MonthlyRequests

      Policies:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
Outputs:

  WebhookQueueUrl:
    Description: CostGate webhook SQS queue
    Value: !Ref WebhookQueue

  ProcessorFunctionName:
    Description: CostGate PR processor Lambda
    Value: !Ref ProcessorFunction

  ReconciliationFunctionName:
    Description: CostGate post-merge billing reconciliation Lambda
    Value: !Ref ReconciliationFunction

  AnalysisFunctionName:
    Description: CostGate VPC analysis Lambda
    Value: !Ref AnalysisFunction